name: Lyrics Source Encoding Fix

on:
  push:
    branches:
      - fix/lyrics-source-contract

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lyrics-source-contract
          fetch-depth: 0
      - name: Restore known-good launcher and add UTF-8 BOM
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'start_musicserver_ui.ps1'
          git checkout f49d1ad89969010fd9cbda3e1b8b2af92b264c5b -- start_musicserver_ui.ps1
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $utf8Bom = [System.Text.UTF8Encoding]::new($true)
          $text = [System.IO.File]::ReadAllText($path, $utf8NoBom)
          [System.IO.File]::WriteAllText($path, $text, $utf8Bom)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- start_musicserver_ui.ps1
          if (git diff --cached --quiet) {
            Write-Host 'No launcher changes needed.'
            exit 0
          }
          git commit -m 'Restore PS5-safe UTF-8 launcher'
          git push origin HEAD:fix/lyrics-source-contract
