name: PR19 Complete Fix

on:
  push:
    branches:
      - feature/configurable-music-library
    paths:
      - '.github/workflows/pr19-complete-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/configurable-music-library
          fetch-depth: 0

      - name: Normalize temporary patch helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.\scripts\pr19_apply_fixes.ps1'
          $lines = [System.Collections.Generic.List[string]]@(Get-Content -LiteralPath $path)
          $bad = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Contains("$agents = $agents.Replace('MUSICSERVER_APP_HOME'")) { $bad = $i; break }
          }
          if ($bad -lt 0) { throw 'Temporary helper AGENTS replacement line not found.' }
          $lines.RemoveAt($bad)
          $insert = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -eq "    Write-RepoText 'AGENTS.md' $agents") { $insert = $i; break }
          }
          if ($insert -lt 0) { throw 'Temporary helper AGENTS write line not found.' }
          $newLine = '    $agents = [regex]::Replace($agents, ''(?m)^MUSICSERVER_APP_HOME$'', "MUSICSERVER_APP_HOME`r`nMUSICSERVER_MUSIC_DIR", 1)'
          $lines.Insert($insert, $newLine)
          [IO.File]::WriteAllLines($path, $lines, (New-Object Text.UTF8Encoding($true)))

      - name: Apply completion patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\pr19_apply_fixes.ps1

      - name: Parser and diff preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          git status --short

      - name: Remove temporary patch machinery
        shell: powershell
        run: |
          Remove-Item -LiteralPath '.\scripts\pr19_apply_fixes.ps1' -Force
          Remove-Item -LiteralPath '.\.github\workflows\pr19-complete-fix.yml' -Force

      - name: Commit fixes to PR branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff check failed' }
          git commit -m "fix: complete configurable music library safety"
          git push origin HEAD:feature/configurable-music-library
