name: PR19 Resolver Fix

on:
  push:
    branches:
      - feature/configurable-music-library
    paths:
      - '.github/workflows/pr19-resolver-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/configurable-music-library
          fetch-depth: 0

      - name: Patch resolver fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'MusicServer.State.psm1'
          $text = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
          $old = "    # Priority 3: Default`n    return `$Config.MusicDir`n"
          $new = "    # Priority 3: Default. Config.MusicDir is mutable after Apply-ConfiguredMusicDir.`n    return (Get-DefaultMusicDir -Root `$Config.Root)`n"
          if (-not $text.Contains($old)) { throw 'Resolver fallback pattern not found.' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($true)))
          Remove-Item -LiteralPath '.github/workflows/pr19-resolver-fix.yml' -Force

      - name: Parser preflight
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'MusicServer.State.psm1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'PowerShell parser failed.'
          }

      - name: Commit to PR branch
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reset music library to immutable default"
          git push origin HEAD:feature/configurable-music-library
