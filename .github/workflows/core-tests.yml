name: MusicServer Core Tests

on:
  push:
    branches:
      - main
      - 'review/**'
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - 'web/**'
      - 'tests/*.cjs'
      - 'src-tauri/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - 'web/**'
      - 'tests/*.cjs'
      - 'src-tauri/**'
      - '.github/workflows/core-tests.yml'

# PowerShell suites stay split across two jobs because a serial run exceeds
# the practical Windows PowerShell 5.1 budget. Desktop packaging is a third,
# independent gate so a green Pester suite cannot mask a broken Rust/Tauri app.
#
# Suites tagged RequiresLocalRuntime assert against a live MusicServer API and
# this machine's library / lyrics_report.csv, so they are excluded here and must
# be run locally.
jobs:
  tests:
    name: ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [state, api]

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Pester 3.4.0
        shell: powershell
        run: |
          $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [Version]'3.4.0' } | Select-Object -First 1
          if (-not $pester) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Ensure sqlite3
        shell: powershell
        run: |
          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {
            choco install sqlite -y --no-progress
            $env:PATH = "$env:PATH;C:\ProgramData\chocolatey\bin"
          }
          $sqlite = Get-Command sqlite3 -ErrorAction Stop
          Write-Host "sqlite3 -> $($sqlite.Source)"

      - name: PowerShell 5.1 parser preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath . -Recurse -File | Where-Object {
            $_.Extension -in '.ps1','.psm1' -and
            $_.FullName -notmatch '[\\/]src-tauri[\\/]target[\\/]'
          })
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "PARSER: $($file.FullName) :: $($_.Message)" }
              throw "PowerShell parser failed: $($file.FullName)"
            }
          }
          Write-Host "Parser preflight passed for $($files.Count) PowerShell files."

      - name: Run Pester suites
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $groups = @{
            state = @('Core', 'Database', 'V2', 'WorkerConcurrency', 'Recommendation', 'LegacyRetirement', 'Listening', 'Web', 'Tauri', 'ConfigurableLibrary', 'TestRunner')
            api   = @('Http', 'UiProxyRuntime', 'MediaRuntime', 'ApiTransaction', 'ApiRuntime')
          }
          $paths = @($groups['${{ matrix.group }}'] | ForEach-Object { ".\tests\MusicServer.$_.Tests.ps1" })
          Write-Host "Suites: $($paths -join ', ')"
          $result = Invoke-Pester -Path $paths -ExcludeTag RequiresLocalRuntime -PassThru
          Write-Host "Passed=$($result.PassedCount) Failed=$($result.FailedCount)"
          if ($result.FailedCount -gt 0) {
            $result.TestResult | Where-Object { $_.Result -eq 'Failed' } | ForEach-Object {
              Write-Host "FAILED: $($_.Name)"
              Write-Host "  :: $($_.FailureMessage)"
            }
            exit 1
          }

  desktop-build:
    name: desktop-build
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Show desktop toolchain
        shell: powershell
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Rust formatting gate
        working-directory: src-tauri
        shell: powershell
        run: cargo fmt --check

      - name: Cargo compile gate
        working-directory: src-tauri
        shell: powershell
        run: cargo check --locked

      - name: Runtime staging and startup probe regressions
        working-directory: src-tauri
        shell: powershell
        run: cargo test --locked

      - name: Ensure sqlite3 for portable runtime
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath 'C:\ProgramData\chocolatey\lib\SQLite\tools\sqlite3.exe')) {
            choco install sqlite -y --no-progress
          }
          $sqlite = 'C:\ProgramData\chocolatey\lib\SQLite\tools\sqlite3.exe'
          if (-not (Test-Path -LiteralPath $sqlite -PathType Leaf)) {
            $sqlite = (Get-Command sqlite3.exe -ErrorAction Stop).Source
          }
          "MUSICSERVER_SQLITE=$sqlite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "desktop sqlite3 -> $sqlite"

      - name: Tauri portable installer gate
        working-directory: src-tauri
        shell: powershell
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Verify installer artifact exists
        shell: powershell
        run: |
          $installers = @(Get-ChildItem -LiteralPath '.\src-tauri\target\release\bundle\nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw 'Tauri NSIS installer was not produced.' }
          $installers | ForEach-Object { Write-Host "installer -> $($_.FullName) ($($_.Length) bytes)" }

      - name: Smoke installed APP without source runtime and with external library
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $BuildMarker = 'musicserver-backend-b-v5'
          $installer = Get-ChildItem -LiteralPath '.\src-tauri\target\release\bundle\nsis' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found for smoke test.' }

          $installDir = Join-Path $env:RUNNER_TEMP 'MusicServerInstalled'
          $appHome = Join-Path $env:RUNNER_TEMP 'MusicServerAppHome'
          $externalLibrary = Join-Path $env:RUNNER_TEMP 'MusicServerExternalLibrary'
          Remove-Item -LiteralPath $installDir,$appHome,$externalLibrary -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $installDir,$appHome,$externalLibrary | Out-Null
          $externalAudio = Join-Path $externalLibrary 'external-test.wav'
          $streamFixture = [IO.File]::Create($externalAudio)
          try { $streamFixture.SetLength(4096) } finally { $streamFixture.Dispose() }
          [IO.File]::WriteAllText((Join-Path $externalLibrary 'external-test.lrc'), '[00:00.00]external smoke', (New-Object Text.UTF8Encoding($false)))

          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S','/NS',("/D={0}" -f $installDir)) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent NSIS install failed with exit code $($install.ExitCode)." }

          $appExe = Get-ChildItem -LiteralPath $installDir -Filter '*.exe' -File -Recurse |
            Where-Object { $_.Name -notmatch 'unins|uninstall' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $appExe) { throw "Installed MusicServer executable not found under $installDir" }
          Write-Host "installed app -> $($appExe.FullName)"

          # Prove that the installed APP does not fall back to the checkout that
          # built it. Old CARGO_MANIFEST_DIR-based binaries fail this smoke.
          $disabled = @()
          foreach ($relative in @('start_musicserver_ui.ps1','music_api.ps1','MusicServer.Core.psm1','web')) {
            $source = Join-Path $env:GITHUB_WORKSPACE $relative
            if (Test-Path -LiteralPath $source) {
              $target = $source + '.ci-disabled'
              Move-Item -LiteralPath $source -Destination $target -Force
              $disabled += [pscustomobject]@{ Source = $source; Target = $target }
            }
          }

          $env:MUSICSERVER_APP_HOME = $appHome
          $desktop = $null
          try {
            function Test-CurrentPair {
              foreach ($pair in @(
                [pscustomobject]@{ Ui = 8790; Api = 8787 },
                [pscustomobject]@{ Ui = 8791; Api = 8788 },
                [pscustomobject]@{ Ui = 8792; Api = 8789 }
              )) {
                try {
                  $appJs = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$($pair.Ui)/app.js" -TimeoutSec 3
                  $health = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$($pair.Api)/health" -TimeoutSec 3
                  if ($appJs.StatusCode -eq 200 -and $health.StatusCode -eq 200 -and
                      $appJs.Content.Contains($BuildMarker) -and $health.Content.Contains($BuildMarker)) {
                    return $pair
                  }
                } catch {}
              }
              return $null
            }

            function Wait-CurrentPair {
              param([Parameter(Mandatory)][Diagnostics.Process]$Process, [int]$Seconds = 75)
              $pair = $null
              $deadline = [DateTime]::UtcNow.AddSeconds($Seconds)
              do {
                if ($Process.HasExited) { throw "Installed APP exited early with code $($Process.ExitCode)." }
                $pair = Test-CurrentPair
                if ($pair) { return $pair }
                Start-Sleep -Milliseconds 500
              } while ([DateTime]::UtcNow -lt $deadline)
              throw "Installed APP did not expose current UI/API within $Seconds seconds."
            }

            function Wait-PortsClosed {
              param([int]$Seconds = 20)
              $deadline = [DateTime]::UtcNow.AddSeconds($Seconds)
              do {
                $stillRunning = $false
                foreach ($port in @(8787,8788,8789,8790,8791,8792)) {
                  try {
                    $client = New-Object Net.Sockets.TcpClient
                    try {
                      if ($client.ConnectAsync('127.0.0.1',$port).Wait(250)) { $stillRunning = $true; break }
                    } finally { $client.Dispose() }
                  } catch {}
                }
                if (-not $stillRunning) { return }
                Start-Sleep -Milliseconds 500
              } while ([DateTime]::UtcNow -lt $deadline)
              throw 'Tauri-owned services did not stop in time.'
            }

            $desktop = Start-Process -FilePath $appExe.FullName -WorkingDirectory $installDir -PassThru
            $pair = Wait-CurrentPair -Process $desktop

            foreach ($required in @(
              (Join-Path $appHome 'start_musicserver_ui.ps1'),
              (Join-Path $appHome 'music_api.ps1'),
              (Join-Path $appHome 'MusicServer.Http.psm1'),
              (Join-Path $appHome 'web\app.js'),
              (Join-Path $appHome 'tools\sqlite3.exe'),
              (Join-Path $appHome 'DailyMix_data\state\musicserver.db')
            )) {
              if (-not (Test-Path -LiteralPath $required)) { throw "Portable runtime smoke missing: $required" }
            }
            Write-Host "portable runtime ready -> $appHome"
            Write-Host "service pair -> UI=$($pair.Ui) API=$($pair.Api)"

            $settingsUri = "http://127.0.0.1:$($pair.Api)/api/settings/music-library"
            $payload = @{ path = $externalLibrary } | ConvertTo-Json -Compress
            $setResult = Invoke-RestMethod -Uri $settingsUri -Method Put -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($payload)) -TimeoutSec 15
            if (-not $setResult.accepted -or -not $setResult.requires_restart) {
              throw 'Installed APP did not accept external music library setting.'
            }

            $kill = Start-Process -FilePath 'taskkill.exe' -ArgumentList @('/PID', "$($desktop.Id)", '/T', '/F') -Wait -PassThru -NoNewWindow
            if ($kill.ExitCode -ne 0) { throw "Failed to stop installed APP before configured-library restart: $($kill.ExitCode)" }
            try { $desktop.WaitForExit(5000) | Out-Null } catch {}
            $desktop = $null
            Wait-PortsClosed

            # The first default startup can create only an empty DailyMix tree.
            # This is a disposable CI APP_HOME: refuse to remove it if any file
            # exists, then remove the empty tree to prove custom startup does not
            # recreate a misleading default Music folder.
            $defaultMusic = Join-Path $appHome 'Music'
            if (Test-Path -LiteralPath $defaultMusic -PathType Container) {
              $defaultFiles = @(Get-ChildItem -LiteralPath $defaultMusic -Recurse -File -Force -ErrorAction SilentlyContinue)
              if ($defaultFiles.Count -gt 0) { throw 'CI default Music fixture unexpectedly contains files; refusing to delete it.' }
              Remove-Item -LiteralPath $defaultMusic -Recurse -Force
            }

            $desktop = Start-Process -FilePath $appExe.FullName -WorkingDirectory $installDir -PassThru
            $pair = Wait-CurrentPair -Process $desktop
            $settingsUri = "http://127.0.0.1:$($pair.Api)/api/settings/music-library"

            $settings = Invoke-RestMethod -Uri $settingsUri -Method Get -TimeoutSec 15
            if ([IO.Path]::GetFullPath([string]$settings.path) -ne [IO.Path]::GetFullPath($externalLibrary)) {
              throw "Configured library was not restored after restart: $($settings.path)"
            }
            if (-not $settings.available) { throw 'Configured external library was reported unavailable.' }
            if (Test-Path -LiteralPath $defaultMusic) { throw 'Custom-library startup recreated the misleading default Music directory.' }

            $library = Invoke-RestMethod -Uri "http://127.0.0.1:$($pair.Api)/api/library" -Method Get -TimeoutSec 20
            $items = @($library.items)
            $item = @($items | Where-Object { [string]$_.title -like '*external-test*' -or [string]$_.file -like '*external-test.wav*' } | Select-Object -First 1)
            if ($item.Count -ne 1 -or -not $item[0].id) { throw 'External library test track was not discovered.' }
            $libraryId = [string]$item[0].id

            $stream = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$($pair.Api)/api/library/$libraryId/stream" -TimeoutSec 15
            if ($stream.StatusCode -ne 200) { throw "External stream failed: $($stream.StatusCode)" }
            $lyrics = Invoke-RestMethod -Uri "http://127.0.0.1:$($pair.Api)/api/library/$libraryId/lyrics" -TimeoutSec 15
            if (-not $lyrics.available) { throw 'External adjacent LRC was not available.' }
            if ([string]$lyrics.text -notmatch 'external smoke') { throw 'External adjacent LRC content was not returned.' }
            $expectedLrc = [IO.Path]::GetFullPath((Join-Path $externalLibrary 'external-test.lrc'))
            if ([IO.Path]::GetFullPath([string]$lyrics.path) -ne $expectedLrc) {
              throw "Lyrics API returned the wrong adjacent file: $($lyrics.path)"
            }

            $reset = Invoke-RestMethod -Uri $settingsUri -Method Delete -TimeoutSec 15
            $expectedDefault = [IO.Path]::GetFullPath($defaultMusic)
            if ([IO.Path]::GetFullPath([string]$reset.path) -ne $expectedDefault) {
              throw "Reset did not return the immutable default path: $($reset.path)"
            }
            if ([IO.Path]::GetFullPath([string]$reset.daily_dir) -ne [IO.Path]::GetFullPath((Join-Path $defaultMusic 'DailyMix'))) {
              throw "Reset returned the wrong DailyMix path: $($reset.daily_dir)"
            }
            Write-Host "external library ready -> $externalLibrary"
          } finally {
            if ($desktop -and -not $desktop.HasExited) {
              $kill = Start-Process -FilePath 'taskkill.exe' `
                -ArgumentList @('/PID', "$($desktop.Id)", '/T', '/F') `
                -Wait -PassThru -NoNewWindow
              if ($kill.ExitCode -ne 0) {
                Write-Warning "taskkill returned exit code $($kill.ExitCode); the APP may have already exited."
              }
            }
            foreach ($item in $disabled) {
              if (Test-Path -LiteralPath $item.Target) {
                Move-Item -LiteralPath $item.Target -Destination $item.Source -Force
              }
            }
          }

          $deadline = [DateTime]::UtcNow.AddSeconds(20)
          do {
            $stillRunning = $false
            foreach ($port in @(8787,8788,8789,8790,8791,8792)) {
              try {
                $client = New-Object Net.Sockets.TcpClient
                try {
                  if ($client.ConnectAsync('127.0.0.1',$port).Wait(250)) { $stillRunning = $true; break }
                } finally { $client.Dispose() }
              } catch {}
            }
            if (-not $stillRunning) { break }
            Start-Sleep -Milliseconds 500
          } while ([DateTime]::UtcNow -lt $deadline)
          if ($stillRunning) { throw 'Tauri-owned services survived installed APP shutdown.' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: musicserver-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
