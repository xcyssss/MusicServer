<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusicServer · 正在准备</title>
<style>
:root{color-scheme:light;font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;color:#294839;background:#e4edda}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 30% 24%,#ffffefb3,transparent 62%),linear-gradient(155deg,#edf0df,#e4ecdb 60%,#ccdfcd);overflow:auto}
main{width:min(100%,520px);padding:32px;text-align:center;line-height:1.8}
.life-mark{display:block;width:240px;max-width:62vw;height:auto;margin:0 auto 22px;overflow:visible}
.seed-drop{transform-origin:120px 126px;animation:drop-arrives 1.15s cubic-bezier(.3,.02,.5,1) both}
.wake{transform-origin:120px 146px;animation:water-opens 1.7s .55s ease-out both}
.wake-late{animation-delay:.82s}
.sprout{stroke-dasharray:95;stroke-dashoffset:95;animation:stem-grows .9s .85s ease-out forwards}
.young-leaf{transform-origin:120px 139px;animation:leaf-unfolds 1.2s 1.05s cubic-bezier(.2,.65,.35,1) both}
.leaf-vein{stroke-dasharray:95;stroke-dashoffset:95;animation:stem-grows 1.2s 1.25s ease-out forwards}
.water-light{animation:water-breath 6s 2.2s ease-in-out infinite}
.brand{font-size:11px;letter-spacing:4px;color:#718862;margin:0 0 8px}
h1{font-size:clamp(22px,4vw,29px);font-weight:500;letter-spacing:2px;margin:0 0 12px}
p{font-size:13px;color:#536951;margin:0 auto;max-width:380px}
button{font:inherit;font-size:14px;color:#294839;border:1px solid #8ba67a;border-radius:24px;background:#fcfff0;padding:9px 23px;margin-top:22px;cursor:pointer}
button:hover{background:#f5fadd}button:focus-visible{outline:2px solid #486e51;outline-offset:4px}
small{display:block;color:#6c795d;font-size:11px;margin-top:22px}
[hidden]{display:none!important}
@keyframes drop-arrives{0%{opacity:0;transform:translateY(-38px) scale(.7)}18%{opacity:.85}64%{opacity:.9;transform:translateY(15px) scale(.8,1.05)}100%{opacity:0;transform:translateY(20px) scale(1.8,.2)}}
@keyframes water-opens{0%{opacity:0;transform:scale(.18,.45)}20%{opacity:.85}100%{opacity:.28;transform:scale(1)}}
@keyframes stem-grows{to{stroke-dashoffset:0}}
@keyframes leaf-unfolds{0%{opacity:0;transform:rotate(-22deg) scale(.12,.35)}55%{opacity:.8}100%{opacity:1;transform:rotate(0) scale(1)}}
@keyframes water-breath{0%,100%{opacity:.45}50%{opacity:.8}}
.still *{animation:none!important}.still .seed-drop{opacity:0}.still .wake{opacity:.28}.still .sprout,.still .leaf-vein{stroke-dashoffset:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.seed-drop{opacity:0}.wake{opacity:.28}.sprout,.leaf-vein{stroke-dashoffset:0}}
@media(max-height:480px){main{padding:16px}.life-mark{width:150px;margin-bottom:8px}small{margin-top:12px}}
</style></head>
<body><main>
<svg class="life-mark" viewBox="0 0 240 190" aria-hidden="true">
  <defs>
    <linearGradient id="life-leaf" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#729966"/><stop offset=".62" stop-color="#bdd493"/><stop offset="1" stop-color="#edf3cc"/></linearGradient>
    <linearGradient id="life-water"><stop stop-color="#608d7220"/><stop offset=".48" stop-color="#648e7599"/><stop offset="1" stop-color="#fffff0"/></linearGradient>
    <radialGradient id="life-light"><stop stop-color="#ffffed" stop-opacity=".9"/><stop offset="1" stop-color="#ffffed" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse class="water-light" cx="120" cy="142" rx="96" ry="36" fill="url(#life-light)"/>
  <path class="wake" d="M32 147C45 124 185 122 208 146C190 169 51 174 32 147Z" fill="none" stroke="url(#life-water)" stroke-width="1.15"/>
  <path class="wake wake-late" d="M61 148C77 134 167 132 182 147C166 160 80 163 61 148Z" fill="none" stroke="url(#life-water)"/>
  <path class="seed-drop" d="M120 96C117 104 112 108 112 115A8 8 0 0 0 128 115C128 108 123 104 120 96Z" fill="#a7c3a1" stroke="#faffed"/>
  <path class="sprout" d="M118 147C113 132 116 117 129 105" fill="none" stroke="#719567" stroke-width="1.5" stroke-linecap="round"/>
  <g class="young-leaf">
    <path d="M119 133C91 101 132 77 170 63C164 91 164 125 119 133Z" fill="url(#life-leaf)" fill-opacity=".82" stroke="#f9ffdf" stroke-width="1.15"/>
    <path class="leaf-vein" d="M117 139C124 115 143 99 164 73M130 112L129 96M142 99L156 99" fill="none" stroke="#62845f" stroke-opacity=".65" stroke-width=".9" stroke-linecap="round"/>
  </g>
</svg>
<div class="brand">MUSICSERVER</div>
<h1 id="title">让音乐，慢慢醒来。</h1><p id="message" role="status">正在连接本地音乐服务，准备音乐库与今日推荐…</p><button id="retry" hidden>重新启动连接</button><small id="hint">你的音乐和喜欢记录会保留在原来的位置。</small></main>
<script>
const failed=new URLSearchParams(location.search).has('failed');
const still=()=>document.body.classList.toggle('still',failed||document.hidden);
still();document.addEventListener('visibilitychange',still);
if(failed){document.title='MusicServer · 连接需要恢复';document.querySelector('#title').textContent='音乐服务暂时未连接';document.querySelector('#message').textContent='本地服务未能完成启动。请重试；如果仍失败，可在应用数据目录的 logs/desktop-startup.json 查看具体原因。';document.querySelector('#retry').hidden=false;}
document.querySelector('#retry').addEventListener('click',async()=>{try{await window.__TAURI__.core.invoke('restart_desktop');}catch(e){document.querySelector('#message').textContent='重启未成功，请关闭窗口后重新打开 MusicServer。';}});
</script></body></html>
