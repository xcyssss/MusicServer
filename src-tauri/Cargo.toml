[package]
name = "musicserver-desktop"
version = "0.2.5"
description = "MusicServer 桌面端 - Tauri v2 壳，加载本地 MusicServer Web UI"
authors = ["MusicServer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

# The APP_HOME pin lives in the registry so this process reads it itself instead of
# inheriting it from whoever started the APP. The installer ends by launching the
# APP through nsis_tauri_utils::RunAsUser, which does not carry the invoking
# session's environment, so an environment-only override silently falls back to the
# default home on the first launch after an install or an update.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
